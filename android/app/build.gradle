apply plugin: 'com.android.application'

// Release signing. Credentials come from android/keystore.properties, which is
// git-ignored and points at a keystore stored outside the repo. When that file
// is absent (a fresh clone, or CI without the secret) the release build falls
// back to UNSIGNED rather than silently signing with the debug key — a debug-
// signed bundle is rejected by Play, and finding that out at upload time is
// worse than finding it out here.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Version. Read from android/version.properties so there is exactly one place
// to bump, and so a release cannot be built with a stale versionCode. This
// file IS tracked in git (it holds no secrets), so its absence means a broken
// checkout rather than a missing local config - fail here, not at upload time
// after Play has already accepted the file and rejected the version.
def versionPropsFile = rootProject.file('version.properties')
if (!versionPropsFile.exists()) {
    throw new GradleException("android/version.properties is missing - it is tracked in git, so restore it rather than guessing a version.")
}
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
def appVersionCode = Integer.parseInt(versionProps['VERSION_CODE'].toString().trim())
def appVersionName = versionProps['VERSION_NAME'].toString().trim()

android {
    namespace = "com.prasadtransport.erp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.prasadtransport.erp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
            // R8 stays OFF. This is a WebView shell: all the app logic is the
            // JavaScript in assets/public, which R8 never touches, so shrinking
            // buys a few hundred KB of Java while risking the reflective
            // lookups Capacitor uses to resolve plugins by class name. Turn it
            // on only with a plugin-aware keep rule set and a device test.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
