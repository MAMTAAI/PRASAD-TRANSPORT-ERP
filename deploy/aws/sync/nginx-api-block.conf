# Add to /etc/nginx/sites-available/prasadtransport.com, alongside the
# existing `location /ai/` and `location /` blocks.
#
# WHY THIS IS MISSING TODAY
# The server block only defines /ai/ and /. A request for /api/v1/... therefore
# matches `location /`, which proxies to the static SPA on :3200 with SPA
# fallback on — so nginx cheerfully answers with index.html and HTTP 200.
# The front-end asks for JSON and is handed a web page. Nothing errors; the
# dashboard simply cannot parse its data. A 200 that returns the wrong
# content-type is worse than a 502, because monitoring calls it healthy.

location /api/ {
    # Trailing slash on proxy_pass strips the /api prefix, so
    #   /api/v1/finance/dashboard  ->  127.0.0.1:3300/v1/finance/dashboard
    # The Fastify app registers its routes under /api/v1, so DO NOT strip it:
    # no trailing slash here, deliberately.
    proxy_pass http://127.0.0.1:3300;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The reconciliation endpoints aggregate over the whole ledger; the default
    # 60s is generous but the dashboard query touches several views.
    proxy_read_timeout 120s;

    # Financial figures must never be served stale from an intermediate cache.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, must-revalidate" always;
}
