# ============================================================================
# prasadtransport.com — Nginx virtual host (AWS t3.large, shared with
# jaiswalcapital.com). This file ONLY adds a new server block; the existing
# Jaiswal Capital vhost file is never touched, so the trading engine keeps
# serving without interruption. Apply with `nginx -t && systemctl reload nginx`
# (reload = graceful, zero dropped connections — never `restart`).
#
# Install path:
#   Ubuntu/Debian : /etc/nginx/sites-available/prasadtransport.com (+ symlink in sites-enabled)
#   Amazon Linux  : /etc/nginx/conf.d/prasadtransport.conf
#
# TLS: run `sudo certbot --nginx -d prasadtransport.com -d www.prasadtransport.com`
# AFTER this block is live on port 80 — certbot rewrites it with the SSL server
# block automatically. If the domain is orange-clouded in Cloudflare, set the
# Cloudflare SSL mode to "Full (strict)" once the origin cert is installed.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prasadtransport.com www.prasadtransport.com;

    # ---- TLS (Let's Encrypt, issued 20-08-2026, auto-renewed by certbot.timer) ----
    ssl_certificate     /etc/letsencrypt/live/prasadtransport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prasadtransport.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ONE SERVER BLOCK, TWO LISTENS — and deliberately NO http->https redirect.
    #
    # A redirect here would loop while the old box still forwards. That box
    # terminates TLS and proxies to this one over plain HTTP; a 301 to
    # https://$host goes back through Cloudflare, to the old box, to here over
    # HTTP again, and round. The browser gives up with ERR_TOO_MANY_REDIRECTS
    # and the site is down — during a cutover, which is exactly when nobody
    # wants to be reading nginx configs.
    #
    # Cloudflare's "Always Use HTTPS" already does this at the edge, correctly,
    # for real visitors. Once the A-record points here and the forward is gone,
    # a redirect guarded on $http_x_forwarded_proto can be added safely.
    #
    # Duplicating the locations into a second server block was the alternative;
    # two copies of eight locations drift, and the one that drifts is always the
    # one nobody is looking at.

    # ---- Compression (SPA vendor chunks are large) ----
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 0. ERP API: /api/* → Fastify (PM2, :3300) ----
    # THIS BLOCK WAS MISSING AND THE FAILURE WAS SILENT.
    #
    # With only /ai/ and / defined, a request for /api/v1/... matched `location /`
    # and was proxied to the static SPA on :3200, which answers ANY unknown path
    # with index.html and HTTP 200 (SPA fallback). So the front end asked for
    # JSON, got a web page, and every screen sat empty with nothing in the error
    # log and monitoring reporting the site healthy. A 200 carrying the wrong
    # content-type is worse than a 502: only a 502 gets investigated.
    #
    # It lived in deploy/aws/sync/nginx-api-block.conf as a manual "paste this
    # in" step, which provision-prasad-box.sh does not do — so every fresh box
    # came up broken in exactly this way. Merged here so provisioning is
    # complete on its own.
    location /api/ {
        # Trailing slash on proxy_pass strips the /api prefix, so
        #   /api/v1/finance/dashboard  ->  127.0.0.1:3300/v1/finance/dashboard
        # The Fastify app registers its routes under /api/v1, so DO NOT strip it:
        # no trailing slash here, deliberately.
        proxy_pass http://127.0.0.1:3300;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The reconciliation endpoints aggregate over the whole ledger; the default
        # 60s is generous but the dashboard query touches several views.
        proxy_read_timeout 120s;

        # Financial figures must never be served stale from an intermediate cache.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---- 1. AI bridge: /ai/* → bridge.cjs (PM2, :3100) → Ollama (:11434) ----
    # Trailing slash on proxy_pass strips the /ai prefix:
    #   /ai/api/chat  → 127.0.0.1:3100/api/chat  (streaming NDJSON)
    #   /ai/api/tags  → 127.0.0.1:3100/api/tags
    #   /ai/api/ai/health → health check (no token needed)
    location /ai/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # LLM specifics: token-by-token streaming must not be buffered, chats
        # can run minutes, and the Bill Scanner posts multi-page base64 images.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }

    # ---- 1b. Socket.io: live GPS push to the dispatch board ----
    #
    # ⚠️ NOT APPLIED AUTOMATICALLY. ci-deploy.sh does not touch nginx, and the
    # live box's config already differs from this file (it proxies /api, which
    # does not appear here). Until someone copies this in and reloads nginx,
    # Socket.io still WORKS but degrades to HTTP long-polling — the client
    # requests ['websocket','polling'] precisely so a missing upgrade does not
    # break the board, only slow it.
    #
    # A WebSocket needs the Upgrade/Connection headers forwarded verbatim. The
    # other blocks here deliberately send `Connection ""` (keep-alive pooling
    # for plain HTTP); doing that on this path silently kills every upgrade.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A socket is idle between GPS fixes; the default 60s read timeout would
        # cut it and make the board reconnect every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 0b. ACME http-01 challenge ----
    # Declared here rather than left to `certbot --nginx` to write, because the
    # SPA fallback below answers ANY unknown path with index.html and HTTP 200.
    # A challenge served as a web page is a failed validation that looks like a
    # served file, and the certificate silently stops renewing ninety days later.
    #
    # `^~` so it beats the regex/prefix blocks, and a real directory rather than
    # a proxy: this must work even when the API, the SPA server or the upstream
    # box is down, which is exactly when a renewal tends to fall due. It also
    # survives Cloudflare's proxy, which forwards port 80 to the origin.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ---- 2a. Hashed build assets: cache hard, they can never change ----
    # Vite fingerprints every file (index-yBmDzAol.js). A given name always has
    # the same bytes, so a year is safe and the browser stops re-fetching 5 MB
    # of bundle on every visit.
    location /assets/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 2b. ERP SPA: everything else → PM2 static server (:3200) ----
    #
    # index.html MUST NOT BE CACHED, and it was — by omission, which is the
    # worst way. Nothing here set Cache-Control, so nginx sent the page with no
    # cache directive at all and browsers fell back to heuristic caching: they
    # keep a copy for a while of their own choosing.
    #
    # index.html is the only file whose NAME never changes; it is the map to
    # every hashed bundle. A stale copy keeps pointing at the previous build's
    # filenames, which the new build has already deleted. The user then gets
    # either the old app or a white screen, hard-refreshes, and sees the old app
    # again — because the refresh re-validates nothing that was never marked
    # revalidatable. On 20-08-2026 that is exactly what happened: three fixes
    # were built, deployed and serving correctly on the box, and the browser
    # kept running the build from before them.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # PWA service worker must never be cached by intermediaries.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
