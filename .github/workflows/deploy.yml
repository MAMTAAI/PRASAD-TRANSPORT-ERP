name: Deploy to AWS EC2

# ⚠️ STATUS 2026-08-15: this runner lane has NEVER worked — all runs fail in
# ~2s before any SSH contact, which means the repo secrets (AWS_HOST,
# AWS_PRIVATE_KEY) are missing or malformed. Deployment does NOT depend on it:
# the box pulls origin/main itself every 3 minutes and runs the same
# deploy/aws/ci-deploy.sh (cron, installed 2026-08-15). Add the secrets in
# repo Settings → Secrets and this lane starts working as a second trigger.

# Every push to main ships to the EC2 box.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession must not deploy at once: the second would
# git-pull while the first is still mid npm-install. Queue them instead.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        # Pinned: @master silently changed script_stop semantics once already —
        # the 2026-08-15 run died 43s in with no trace. v1 is the stable line.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          # Optional secret. Left unset, it falls back to the standard Ubuntu
          # AMI user, so only two secrets are actually required.
          username: ${{ secrets.AWS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          # One versioned procedure, shared with the box's own cron auto-puller.
          # bash explicitly: the script uses bash features and must not depend
          # on whatever shell the action hands it.
          script: |
            bash /var/www/prasad-erp/deploy/aws/ci-deploy.sh
