# Single source of truth for what Play sees as "the version".
#
# These used to be literals in app/build.gradle, which meant every release was
# built as versionCode 1 and the second upload was rejected by Play with
# "Version code 1 has already been used" - after the whole build had run.
#
# VERSION_CODE  integer, MUST increase on every upload to Play, never reused
#               even for a discarded release. Users never see it.
# VERSION_NAME  the string on the store listing and the About screen.
#
# Kept ASCII on purpose: java.util.Properties reads this as ISO-8859-1, so a
# stray em-dash comes back as mojibake.
#
# Bump with:  node scripts/bump-android-version.cjs [major|minor|patch]
VERSION_CODE=2
VERSION_NAME=1.0.1
