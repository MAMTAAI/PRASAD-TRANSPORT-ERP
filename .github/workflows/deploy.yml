name: Deploy to AWS EC2

# Every push to main ships to the EC2 box.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession must not deploy at once: the second would
# git-pull while the first is still mid npm-install. Queue them instead.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        # Pinned: @master silently changed script_stop semantics once already —
        # the 2026-08-15 run died 43s in with no trace. v1 is the stable line.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          # Optional secret. Left unset, it falls back to the standard Ubuntu
          # AMI user, so only two secrets are actually required.
          username: ${{ secrets.AWS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          # Without this the remote script keeps running after a failed command
          # and the job still reports success — a failed git pull would look
          # like a clean deploy.
          script_stop: true
          script: |
            set -e
            # Every deploy leaves a full transcript on the box — when a run
            # dies and the Actions log is out of reach, read this instead.
            exec > >(tee /tmp/ci-deploy.log) 2>&1
            echo "CI deploy started: $(date -u)"

            # The first two paths are the ones specified. /var/www/prasad-erp is
            # where deploy/aws/DEPLOY-AWS.md actually installs the app, so on
            # this box it is the one that will match. Drop whichever are not
            # real for your server.
            cd /var/www/PRASAD-TRANSPORT-ERP || cd ~/PRASAD-TRANSPORT-ERP || cd /var/www/prasad-erp
            echo "Deploying in: $(pwd)"

            git pull origin main

            # Full install, not --production: prasad-erp-web serves the built
            # dist/ (PM2 static server), and building it needs Vite, which is a
            # devDependency. Without this step a deploy ships the API but the
            # site keeps serving the previous UI forever. Playwright's browser
            # download is skipped — nothing on the box runs UI tests.
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund

            npm run build

            # Schema first, then the API that expects it. The runner is
            # forward-only, transactional per file, checksum-tracked, and stops
            # at the first failure — set -e then aborts BEFORE the restart, so
            # the old API (matching the old schema) keeps running.
            # PG credentials live in .env.api on the box (not .env), so load it
            # explicitly — dotenv inside migrate.js only reads .env.
            node --env-file=.env.api server/db/migrate.js

            # ⚠️ THIS BOX ALSO RUNS JAISWAL CAPITAL. Never `pm2 restart all` —
            # that restarts the live trading engine too, which during market
            # hours is an outage in an unrelated system. Only the prasad-* apps
            # (names from deploy/aws/ecosystem.prasad.config.cjs):
            pm2 restart prasad-erp-api prasad-erp-web prasad-ai-bridge

            pm2 save
            pm2 status
